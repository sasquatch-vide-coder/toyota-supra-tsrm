<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{MODEL_NAME}} — TSRM Offline Viewer</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700;800;900&family=Manrope:wght@200;300;400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
/* ── Kinetic Tokyo Design System ── */
:root {
  --color-surface: #0e0e13;
  --color-surface-low: #131318;
  --color-surface-mid: #19191f;
  --color-surface-high: #1f1f26;
  --color-surface-highest: #25252c;
  --color-surface-bright: #2c2b33;
  --color-primary: #de8eff;
  --color-primary-dim: #b90afc;
  --color-secondary: #00f1fd;
  --color-tertiary: #ff6e81;
  --color-text: #f8f5fd;
  --color-text-muted: #acaab1;
  --color-text-faint: #76747b;
  --color-border: rgba(72, 71, 77, 0.15);
  --color-border-faint: rgba(72, 71, 77, 0.08);
}
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Manrope', sans-serif; background: var(--color-surface); color: var(--color-text); height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
::selection { background: var(--color-secondary); color: #00565a; }
::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--color-surface-highest); border-radius: 3px; }

/* ── Top Bar ── */
.topbar { background: var(--color-surface-low); padding: 10px 20px; display: flex; align-items: center; gap: 16px; flex-shrink: 0; backdrop-filter: blur(16px); }
.topbar-brand { font-family: 'Space Grotesk', sans-serif; font-size: 16px; font-weight: 900; font-style: italic; letter-spacing: -0.02em; background: linear-gradient(135deg, var(--color-primary), var(--color-primary-dim)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; padding-right: 4px; }
.topbar-model { font-family: 'Space Grotesk', sans-serif; font-size: 11px; letter-spacing: 0.12em; color: var(--color-text-muted); text-transform: uppercase; }
.topbar-sep { color: var(--color-text-faint); opacity: 0.4; }
.hamburger { display: none; background: none; border: none; color: var(--color-primary); font-size: 20px; cursor: pointer; padding: 4px 8px; }

/* ── Accent Stripe ── */
.stripe { height: 3px; flex-shrink: 0; background: linear-gradient(to right, var(--color-primary), var(--color-primary-dim), var(--color-secondary)); }

/* ── Layout ── */
.main { display: flex; flex: 1; min-height: 0; }

/* ── Sidebar ── */
.sidebar { width: 260px; flex-shrink: 0; background: var(--color-surface-low); display: flex; flex-direction: column; overflow-y: auto; border-right: 1px solid var(--color-border-faint); }
.sidebar-header { padding: 16px 20px 12px; border-bottom: 1px solid var(--color-border-faint); background: linear-gradient(180deg, rgba(0, 241, 253, 0.03) 0%, transparent 100%); }
.sidebar-label { font-family: 'Space Grotesk', sans-serif; font-size: 9px; letter-spacing: 0.2em; color: var(--color-text-muted); text-transform: uppercase; margin-bottom: 4px; }
.sidebar-meta { font-family: 'Space Grotesk', sans-serif; font-size: 10px; color: var(--color-text-faint); }

/* ── Doc Type Tabs ── */
.doc-tabs { display: flex; border-bottom: 1px solid var(--color-border-faint); }
.doc-tab { flex: 1; padding: 10px 12px; font-family: 'Space Grotesk', sans-serif; font-size: 10px; letter-spacing: 0.15em; text-transform: uppercase; text-align: center; cursor: pointer; background: none; border: none; color: var(--color-text-muted); border-bottom: 2px solid transparent; transition: color 0.2s; }
.doc-tab:hover { color: var(--color-text); }
.doc-tab.active { color: var(--color-secondary); border-bottom-color: var(--color-secondary); }

/* ── Section List ── */
.section-list { flex: 1; padding: 4px 0; overflow-y: auto; }
.section-item { display: flex; align-items: center; gap: 12px; padding: 8px 20px; cursor: pointer; border-left: 3px solid transparent; text-decoration: none; transition: background-color 0.2s; }
.section-item:hover { background: rgba(255,255,255,0.03); }
.section-item.active { border-left-color: var(--color-secondary); background: rgba(0, 241, 253, 0.05); }
.section-code { font-family: 'Space Grotesk', sans-serif; font-size: 11px; font-weight: 700; color: var(--color-secondary); min-width: 48px; letter-spacing: 0.05em; flex-shrink: 0; }
.section-name { font-family: 'Manrope', sans-serif; font-size: 13px; color: var(--color-text-muted); line-height: 1.3; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.section-item.active .section-name { color: var(--color-text); font-weight: 600; }

/* ── Content Area ── */
.content { flex: 1; display: flex; flex-direction: column; min-width: 0; }

/* ── Page Nav ── */
.page-nav { display: flex; align-items: center; justify-content: space-between; padding: 8px 16px; background: var(--color-surface-high); border-bottom: 1px solid var(--color-border-faint); flex-shrink: 0; }
.breadcrumb { font-family: 'Space Grotesk', sans-serif; font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: -0.01em; }
.breadcrumb .sec-code { color: var(--color-secondary); }
.breadcrumb .sec-sep { color: var(--color-text-faint); margin: 0 6px; }
.breadcrumb .sec-name { color: var(--color-text-muted); }
.page-pill { background: rgba(0, 241, 253, 0.15); color: var(--color-secondary); padding: 2px 10px; border-radius: 9999px; font-family: 'Space Grotesk', sans-serif; font-size: 10px; font-weight: 700; letter-spacing: 0.05em; margin-left: 12px; }
.nav-buttons { display: flex; gap: 6px; }
.nav-btn { padding: 6px 12px; font-family: 'Space Grotesk', sans-serif; font-size: 10px; font-weight: 700; letter-spacing: 0.15em; text-transform: uppercase; cursor: pointer; border: none; border-radius: 2px; transition: background-color 0.2s, color 0.2s; }
.nav-btn.primary { background: var(--color-surface-highest); color: var(--color-text-muted); }
.nav-btn.primary:hover { background: var(--color-primary); color: #4f006e; }
.nav-btn:disabled { opacity: 0.3; cursor: default; }
.nav-btn:disabled:hover { background: var(--color-surface-highest); color: var(--color-text-muted); }

/* ── Image Viewer ── */
.viewer { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative; background: var(--color-surface); border: 1px solid var(--color-border); box-shadow: 0 4px 24px rgba(0,0,0,0.25); cursor: zoom-in; touch-action: none; }
.viewer img { display: block; max-width: 100%; max-height: 100%; object-fit: contain; user-select: none; transform-origin: center center; }
.viewer.zoomed { cursor: grab; }
.viewer.dragging { cursor: grabbing; }

/* ── Zoom Controls ── */
.zoom-controls { position: absolute; bottom: 12px; right: 12px; display: flex; align-items: center; gap: 2px; background: var(--color-surface-highest); padding: 2px 6px; font-family: 'Space Grotesk', sans-serif; font-size: 12px; color: var(--color-text); letter-spacing: 0.05em; border-radius: 4px; border: 1px solid var(--color-border); user-select: none; }
.zoom-btn { background: none; border: none; color: var(--color-text); cursor: pointer; font-size: 20px; padding: 6px 10px; line-height: 1; min-width: 36px; min-height: 36px; display: flex; align-items: center; justify-content: center; }
.zoom-pct { min-width: 44px; text-align: center; }
.zoom-pct.active { color: var(--color-secondary); }
.zoom-reset { background: none; border: none; color: var(--color-secondary); cursor: pointer; font-size: 10px; padding: 6px 10px; font-family: 'Space Grotesk', sans-serif; letter-spacing: 0.1em; min-height: 36px; display: flex; align-items: center; }

/* ── Page Info (bottom) ── */
.page-info { padding: 6px 16px; text-align: center; font-family: 'Space Grotesk', sans-serif; font-size: 10px; color: var(--color-text-faint); letter-spacing: 0.15em; text-transform: uppercase; flex-shrink: 0; border-top: 1px solid var(--color-border-faint); background: var(--color-surface-high); }

/* ── Sidebar Backdrop (mobile) ── */
.sidebar-backdrop { display: none; }

/* ── Responsive ── */
@media (max-width: 768px) {
  .sidebar { display: none; position: fixed; top: 0; left: 0; bottom: 0; width: 280px; height: 100dvh; z-index: 100; }
  .sidebar.open { display: flex; }
  .sidebar-backdrop.open { display: block; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 99; }
  .hamburger { display: block; }
  .page-nav { padding: 6px 12px; }
  .page-info { padding: 4px 12px; }
  .breadcrumb { font-size: 11px; }
}
</style>
</head>
<body>

<!-- Top Bar -->
<div class="topbar">
  <button class="hamburger" onclick="toggleSidebar()" aria-label="Menu">&#9776;</button>
  <span class="topbar-brand">TSRM</span>
  <span class="topbar-sep">/</span>
  <span class="topbar-model" id="topbar-model"></span>
</div>
<div class="stripe"></div>

<div class="main">
  <!-- Sidebar Backdrop -->
  <div class="sidebar-backdrop" id="backdrop" onclick="toggleSidebar()"></div>

  <!-- Sidebar -->
  <div class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-label">Sections</div>
      <div class="sidebar-meta" id="sidebar-meta"></div>
    </div>
    <div class="doc-tabs" id="doc-tabs"></div>
    <div class="section-list" id="section-list"></div>
  </div>

  <!-- Content -->
  <div class="content">
    <div class="page-nav">
      <div style="display:flex;align-items:center;">
        <div class="breadcrumb" id="breadcrumb"></div>
        <span class="page-pill" id="page-pill"></span>
      </div>
      <div class="nav-buttons">
        <button class="nav-btn primary" id="btn-prev" onclick="navigatePrev()">&#8592; PREV</button>
        <button class="nav-btn primary" id="btn-next" onclick="navigateNext()">NEXT &#8594;</button>
      </div>
    </div>
    <div class="viewer" id="viewer">
      <img id="page-img" draggable="false" alt="" />
      <div class="zoom-controls" id="zoom-controls">
        <button class="zoom-btn" onclick="zoomOut()">&#8722;</button>
        <span class="zoom-pct" id="zoom-pct">100%</span>
        <button class="zoom-btn" onclick="zoomIn()">+</button>
        <button class="zoom-reset" id="zoom-reset-btn" onclick="resetZoom()" style="display:none">RESET</button>
      </div>
    </div>
    <div class="page-info" id="page-info"></div>
  </div>
</div>

<script>
// ── Data (injected by build script) ──
const MODEL_INFO = {{MODEL_INFO}};
const TSRM_SECTIONS = {{TSRM_SECTIONS}};
const EWD_SECTIONS = {{EWD_SECTIONS}};

// ── State ──
const state = {
  docType: TSRM_SECTIONS.length > 0 ? 'tsrm' : 'ewd',
  section: null,
  page: null,
  zoom: 1,
  pan: { x: 0, y: 0 },
  dragging: false,
  dragStart: { x: 0, y: 0 },
  panStart: { x: 0, y: 0 },
  sidebarOpen: false,
  lastPinchDist: null,
  pinchZoomStart: 1
};

const MIN_ZOOM = 1;
const MAX_ZOOM = 5;

// ── Elements ──
const $ = (id) => document.getElementById(id);
const viewer = $('viewer');
const img = $('page-img');
const breadcrumb = $('breadcrumb');
const pagePill = $('page-pill');
const pageInfo = $('page-info');
const btnPrev = $('btn-prev');
const btnNext = $('btn-next');
const zoomPct = $('zoom-pct');
const zoomResetBtn = $('zoom-reset-btn');
const sidebar = $('sidebar');
const backdrop = $('backdrop');

// ── Init ──
function init() {
  $('topbar-model').textContent = MODEL_INFO.name + ' \u00B7 ' + MODEL_INFO.year;
  renderDocTabs();
  const sections = getCurrentSections();
  if (sections.length > 0 && sections[0].page_index.length > 0) {
    navigate(state.docType, sections[0].code, sections[0].page_index[0].page);
  }
}

function getCurrentSections() {
  return state.docType === 'tsrm' ? TSRM_SECTIONS : EWD_SECTIONS;
}

// ── Doc Type Tabs ──
function renderDocTabs() {
  const tabs = $('doc-tabs');
  tabs.innerHTML = '';
  if (TSRM_SECTIONS.length > 0) {
    const btn = document.createElement('button');
    btn.className = 'doc-tab' + (state.docType === 'tsrm' ? ' active' : '');
    btn.textContent = 'Service Manual';
    btn.onclick = () => switchDocType('tsrm');
    tabs.appendChild(btn);
  }
  if (EWD_SECTIONS.length > 0) {
    const btn = document.createElement('button');
    btn.className = 'doc-tab' + (state.docType === 'ewd' ? ' active' : '');
    btn.textContent = 'Wiring Diagrams';
    btn.onclick = () => switchDocType('ewd');
    tabs.appendChild(btn);
  }
  if ((TSRM_SECTIONS.length === 0) || (EWD_SECTIONS.length === 0)) {
    tabs.style.display = 'none';
  }
}

function switchDocType(docType) {
  state.docType = docType;
  renderDocTabs();
  const sections = getCurrentSections();
  if (sections.length > 0 && sections[0].page_index.length > 0) {
    navigate(docType, sections[0].code, sections[0].page_index[0].page);
  }
}

// ── Navigation ──
function navigate(docType, sectionCode, pageNum) {
  state.docType = docType;
  state.section = sectionCode;
  state.page = pageNum;
  resetZoom();
  renderSidebar();
  renderPage();
  updateNav();
}

function renderSidebar() {
  const sections = getCurrentSections();
  const totalPages = sections.reduce((sum, s) => sum + s.pages, 0);
  $('sidebar-meta').textContent = sections.length + ' sections \u00B7 ' + totalPages.toLocaleString() + ' pages';

  const list = $('section-list');
  list.innerHTML = '';
  sections.forEach(s => {
    const item = document.createElement('div');
    item.className = 'section-item' + (s.code === state.section ? ' active' : '');
    item.innerHTML = '<span class="section-code">' + escHtml(s.code) + '</span><span class="section-name">' + escHtml(s.name) + '</span>';
    item.onclick = () => {
      if (s.page_index.length > 0) {
        navigate(state.docType, s.code, s.page_index[0].page);
        closeSidebar();
      }
    };
    list.appendChild(item);
  });
}

function renderPage() {
  const path = getImagePath(state.docType, state.section, state.page);
  img.src = path;
  img.alt = state.section + ' page ' + state.page;

  const section = findSection(state.docType, state.section);
  const pageEntry = section ? section.page_index.find(p => p.page === state.page) : null;
  const padded = String(state.page).padStart(3, '0');
  breadcrumb.innerHTML = '<span class="sec-code">' + escHtml(state.section) + '</span><span class="sec-sep">/</span><span class="sec-name">' + (section ? escHtml(section.name) : '') + '</span>';
  pagePill.textContent = state.page + ' / ' + (section ? section.pages : '?');
  pageInfo.textContent = (section ? section.name : '') + ' \u2014 Page ' + padded + (pageEntry && pageEntry.title ? ' \u2014 ' + pageEntry.title.replace(/\n/g, ' ') : '');
}

function getImagePath(docType, section, page) {
  const padded = String(page).padStart(3, '0');
  const folder = docType === 'tsrm' ? 'tsrm' : 'ewd';
  return folder + '/' + section + '/' + section + '_' + padded + '.png';
}

function findSection(docType, code) {
  const sections = docType === 'tsrm' ? TSRM_SECTIONS : EWD_SECTIONS;
  return sections.find(s => s.code === code);
}

// ── Prev / Next ──
function getAdjacentPage(direction) {
  const sections = getCurrentSections();
  let secIdx = sections.findIndex(s => s.code === state.section);
  if (secIdx < 0) return null;
  const sec = sections[secIdx];
  const pageIdx = sec.page_index.findIndex(p => p.page === state.page);

  if (direction === -1 && pageIdx > 0) {
    return { section: sec.code, page: sec.page_index[pageIdx - 1].page };
  }
  if (direction === 1 && pageIdx < sec.page_index.length - 1) {
    return { section: sec.code, page: sec.page_index[pageIdx + 1].page };
  }
  const nextSecIdx = secIdx + direction;
  if (nextSecIdx < 0 || nextSecIdx >= sections.length) return null;
  const nextSec = sections[nextSecIdx];
  if (nextSec.page_index.length === 0) return null;
  const nextPage = direction === 1 ? nextSec.page_index[0].page : nextSec.page_index[nextSec.page_index.length - 1].page;
  return { section: nextSec.code, page: nextPage };
}

function navigatePrev() {
  const target = getAdjacentPage(-1);
  if (target) navigate(state.docType, target.section, target.page);
}

function navigateNext() {
  const target = getAdjacentPage(1);
  if (target) navigate(state.docType, target.section, target.page);
}

function updateNav() {
  btnPrev.disabled = !getAdjacentPage(-1);
  btnNext.disabled = !getAdjacentPage(1);
}

// ── Keyboard ──
document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowLeft') { e.preventDefault(); navigatePrev(); }
  if (e.key === 'ArrowRight') { e.preventDefault(); navigateNext(); }
});

// ── Zoom / Pan (all pages) ──
function applyTransform() {
  const transition = state.dragging ? 'none' : 'transform 0.15s ease-out';
  img.style.transition = transition;
  img.style.transform = 'scale(' + state.zoom + ') translate(' + state.pan.x + 'px, ' + state.pan.y + 'px)';
  zoomPct.textContent = Math.round(state.zoom * 100) + '%';
  zoomPct.className = 'zoom-pct' + (state.zoom > MIN_ZOOM ? ' active' : '');
  viewer.classList.toggle('zoomed', state.zoom > MIN_ZOOM);
  zoomResetBtn.style.display = state.zoom > MIN_ZOOM ? 'flex' : 'none';
}

function zoomIn() {
  state.zoom = Math.min(MAX_ZOOM, state.zoom * 1.3);
  applyTransform();
}

function zoomOut() {
  state.zoom = Math.max(MIN_ZOOM, state.zoom / 1.3);
  if (state.zoom <= MIN_ZOOM) { state.pan.x = 0; state.pan.y = 0; }
  applyTransform();
}

function resetZoom() {
  state.zoom = MIN_ZOOM;
  state.pan = { x: 0, y: 0 };
  state.dragging = false;
  viewer.classList.remove('dragging');
  applyTransform();
}

// Mouse wheel zoom
viewer.addEventListener('wheel', (e) => {
  e.preventDefault();
  const delta = e.deltaY > 0 ? 0.9 : 1.1;
  state.zoom = Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, state.zoom * delta));
  if (state.zoom <= MIN_ZOOM) { state.pan.x = 0; state.pan.y = 0; }
  applyTransform();
}, { passive: false });

// Mouse/pen drag
viewer.addEventListener('pointerdown', (e) => {
  if (e.pointerType === 'touch') return;
  if (state.zoom <= MIN_ZOOM) return;
  state.dragging = true;
  state.dragStart = { x: e.clientX, y: e.clientY };
  state.panStart = { x: state.pan.x, y: state.pan.y };
  viewer.classList.add('dragging');
  viewer.setPointerCapture(e.pointerId);
});

viewer.addEventListener('pointermove', (e) => {
  if (e.pointerType === 'touch') return;
  if (!state.dragging) return;
  state.pan.x = state.panStart.x + (e.clientX - state.dragStart.x) / state.zoom;
  state.pan.y = state.panStart.y + (e.clientY - state.dragStart.y) / state.zoom;
  applyTransform();
});

viewer.addEventListener('pointerup', (e) => {
  if (e.pointerType === 'touch') return;
  if (!state.dragging) return;
  state.dragging = false;
  viewer.classList.remove('dragging');
});

// Double-click/tap: toggle zoom
viewer.addEventListener('dblclick', () => {
  if (state.zoom > MIN_ZOOM) {
    resetZoom();
  } else {
    state.zoom = 2.5;
    applyTransform();
  }
});

// Touch: pinch-to-zoom + single-finger pan
(function() {
  function getDist(t1, t2) {
    const dx = t1.clientX - t2.clientX;
    const dy = t1.clientY - t2.clientY;
    return Math.sqrt(dx * dx + dy * dy);
  }

  viewer.addEventListener('touchstart', (e) => {
    if (e.touches.length === 2) {
      e.preventDefault();
      state.lastPinchDist = getDist(e.touches[0], e.touches[1]);
      state.pinchZoomStart = state.zoom;
    } else if (e.touches.length === 1 && state.zoom > MIN_ZOOM) {
      e.preventDefault();
      state.dragging = true;
      state.dragStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
      state.panStart = { x: state.pan.x, y: state.pan.y };
    }
  }, { passive: false });

  viewer.addEventListener('touchmove', (e) => {
    if (e.touches.length === 2 && state.lastPinchDist !== null) {
      e.preventDefault();
      const dist = getDist(e.touches[0], e.touches[1]);
      const scale = dist / state.lastPinchDist;
      state.zoom = Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, state.pinchZoomStart * scale));
      if (state.zoom <= MIN_ZOOM) { state.pan.x = 0; state.pan.y = 0; }
      applyTransform();
    } else if (e.touches.length === 1 && state.zoom > MIN_ZOOM) {
      e.preventDefault();
      state.pan.x = state.panStart.x + (e.touches[0].clientX - state.dragStart.x) / state.zoom;
      state.pan.y = state.panStart.y + (e.touches[0].clientY - state.dragStart.y) / state.zoom;
      applyTransform();
    }
  }, { passive: false });

  viewer.addEventListener('touchend', (e) => {
    if (e.touches.length < 2) state.lastPinchDist = null;
    if (e.touches.length === 0) {
      state.dragging = false;
      viewer.classList.remove('dragging');
    }
  });
})();

// ── Sidebar Toggle (mobile) ──
function toggleSidebar() {
  state.sidebarOpen = !state.sidebarOpen;
  sidebar.classList.toggle('open', state.sidebarOpen);
  backdrop.classList.toggle('open', state.sidebarOpen);
}

function closeSidebar() {
  state.sidebarOpen = false;
  sidebar.classList.remove('open');
  backdrop.classList.remove('open');
}

// ── Utils ──
function escHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// ── Start ──
init();
</script>
</body>
</html>
