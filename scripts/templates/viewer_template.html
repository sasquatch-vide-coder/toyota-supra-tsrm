<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{MODEL_NAME}} — TSRM Offline Viewer</title>
<style>
/* ── Color Variables ── */
:root {
  --color-red: #C41E3A;
  --color-dark: #1A1A1A;
  --color-tan: #8B7355;
  --color-border: #D4C9B8;
  --color-cream: #F5F0E8;
  --color-bg: #FAF8F4;
  --color-brown: #4A3A2A;
  --color-brown-mid: #6B5A4A;
  --color-dark-border: #2A2A2A;
}
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: Arial, Helvetica, sans-serif; background: var(--color-cream); color: var(--color-dark); height: 100vh; overflow: hidden; display: flex; flex-direction: column; }

/* ── Top Bar ── */
.topbar { background: var(--color-dark); padding: 10px 20px; display: flex; align-items: center; gap: 16px; flex-shrink: 0; }
.topbar-brand { font-family: monospace; font-size: 14px; font-weight: 900; letter-spacing: 0.3em; color: var(--color-red); }
.topbar-model { font-family: monospace; font-size: 11px; letter-spacing: 0.25em; color: var(--color-tan); text-transform: uppercase; }
.topbar-sep { color: var(--color-dark-border); }
.hamburger { display: none; background: none; border: none; color: var(--color-cream); font-size: 20px; cursor: pointer; padding: 4px 8px; }

/* ── Racing Stripe ── */
.stripe { display: flex; height: 4px; flex-shrink: 0; }
.stripe-red { flex: 4; background: var(--color-red); }
.stripe-dark { flex: 1; background: var(--color-dark); }
.stripe-tan { flex: 2; background: var(--color-tan); }

/* ── Layout ── */
.main { display: flex; flex: 1; min-height: 0; }

/* ── Sidebar ── */
.sidebar { width: 260px; flex-shrink: 0; background: var(--color-dark); display: flex; flex-direction: column; overflow-y: auto; }
.sidebar-header { padding: 16px 16px 12px; border-bottom: 1px solid var(--color-dark-border); }
.sidebar-label { font-family: monospace; font-size: 9px; letter-spacing: 0.3em; color: var(--color-tan); text-transform: uppercase; margin-bottom: 4px; }
.sidebar-meta { font-family: monospace; font-size: 10px; color: var(--color-brown); }

/* ── Doc Type Tabs ── */
.doc-tabs { display: flex; border-bottom: 1px solid var(--color-dark-border); }
.doc-tab { flex: 1; padding: 10px 12px; font-family: monospace; font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; text-align: center; cursor: pointer; background: none; border: none; color: var(--color-tan); border-bottom: 2px solid transparent; }
.doc-tab:hover { color: var(--color-cream); }
.doc-tab.active { color: var(--color-red); border-bottom-color: var(--color-red); }

/* ── Section List ── */
.section-list { flex: 1; padding: 8px 0; overflow-y: auto; }
.section-item { display: flex; align-items: center; gap: 10px; padding: 8px 16px; cursor: pointer; border-left: 3px solid transparent; text-decoration: none; }
.section-item:hover { background: rgba(255,255,255,0.03); }
.section-item.active { border-left-color: var(--color-red); }
.section-code { font-family: monospace; font-size: 12px; font-weight: 900; color: var(--color-red); min-width: 40px; letter-spacing: 0.05em; }
.section-name { font-family: Georgia, serif; font-size: 13px; color: var(--color-tan); line-height: 1.3; }
.section-item.active .section-name { color: var(--color-cream); }

/* ── Content Area ── */
.content { flex: 1; display: flex; flex-direction: column; min-width: 0; }

/* ── Page Nav ── */
.page-nav { display: flex; align-items: center; justify-content: space-between; padding: 10px 20px; background: var(--color-bg); border-bottom: 1px solid var(--color-border); flex-shrink: 0; }
.breadcrumb { font-family: monospace; font-size: 11px; color: var(--color-tan); letter-spacing: 0.15em; text-transform: uppercase; }
.breadcrumb strong { color: var(--color-dark); }
.nav-buttons { display: flex; gap: 8px; }
.nav-btn { padding: 6px 16px; font-family: monospace; font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase; cursor: pointer; border: none; font-weight: 700; }
.nav-btn.primary { background: var(--color-red); color: #fff; }
.nav-btn.primary:hover { background: #a3182f; }
.nav-btn:disabled { opacity: 0.3; cursor: default; }
.nav-btn:disabled:hover { background: var(--color-red); }

/* ── Image Viewer ── */
.viewer { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative; background: #fff; border: 1px solid var(--color-border); margin: 16px 20px; box-shadow: 0 4px 24px rgba(0,0,0,0.10); }
.viewer img { display: block; max-width: 100%; max-height: 100%; object-fit: contain; user-select: none; transform-origin: center center; }
.viewer.ewd { cursor: zoom-in; touch-action: none; }
.viewer.ewd.zoomed { cursor: grab; }
.viewer.ewd.dragging { cursor: grabbing; }

/* ── Zoom Controls ── */
.zoom-controls { position: absolute; bottom: 12px; right: 12px; display: flex; align-items: center; gap: 8px; background: rgba(26,26,26,0.8); padding: 6px 12px; font-family: monospace; font-size: 11px; color: var(--color-cream); letter-spacing: 0.1em; user-select: none; }
.zoom-btn { background: none; border: none; color: var(--color-cream); cursor: pointer; font-size: 14px; padding: 0 4px; }
.zoom-reset { background: none; border: none; color: var(--color-tan); cursor: pointer; font-size: 10px; padding: 0 4px; font-family: monospace; letter-spacing: 0.1em; }

/* ── Page Info (bottom) ── */
.page-info { padding: 8px 20px; text-align: center; font-family: monospace; font-size: 10px; color: var(--color-tan); letter-spacing: 0.2em; text-transform: uppercase; flex-shrink: 0; border-top: 1px solid var(--color-border); background: var(--color-bg); }

/* ── Sidebar Backdrop (mobile) ── */
.sidebar-backdrop { display: none; }

/* ── Responsive ── */
@media (max-width: 768px) {
  .sidebar { display: none; position: fixed; top: 0; left: 0; bottom: 0; width: 260px; z-index: 100; }
  .sidebar.open { display: flex; }
  .sidebar-backdrop.open { display: block; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 99; }
  .hamburger { display: block; }
  .viewer { margin: 8px 12px; }
  .page-nav { padding: 8px 12px; }
  .page-info { padding: 6px 12px; }
  .breadcrumb { font-size: 10px; }
}
</style>
</head>
<body>

<!-- Top Bar -->
<div class="topbar">
  <button class="hamburger" onclick="toggleSidebar()" aria-label="Menu">&#9776;</button>
  <span class="topbar-brand">TSRM</span>
  <span class="topbar-sep">|</span>
  <span class="topbar-model" id="topbar-model"></span>
</div>
<div class="stripe"><div class="stripe-red"></div><div class="stripe-dark"></div><div class="stripe-tan"></div></div>

<div class="main">
  <!-- Sidebar Backdrop -->
  <div class="sidebar-backdrop" id="backdrop" onclick="toggleSidebar()"></div>

  <!-- Sidebar -->
  <div class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-label">Sections</div>
      <div class="sidebar-meta" id="sidebar-meta"></div>
    </div>
    <div class="doc-tabs" id="doc-tabs"></div>
    <div class="section-list" id="section-list"></div>
  </div>

  <!-- Content -->
  <div class="content">
    <div class="page-nav">
      <div class="breadcrumb" id="breadcrumb"></div>
      <div class="nav-buttons">
        <button class="nav-btn primary" id="btn-prev" onclick="navigatePrev()">&#8592; PREV</button>
        <button class="nav-btn primary" id="btn-next" onclick="navigateNext()">NEXT &#8594;</button>
      </div>
    </div>
    <div class="viewer" id="viewer">
      <img id="page-img" draggable="false" alt="" />
      <div class="zoom-controls" id="zoom-controls" style="display:none">
        <button class="zoom-btn" onclick="zoomOut()">&#8722;</button>
        <span id="zoom-pct">100%</span>
        <button class="zoom-btn" onclick="zoomIn()">+</button>
        <button class="zoom-reset" id="zoom-reset-btn" onclick="resetZoom()" style="display:none">RESET</button>
      </div>
    </div>
    <div class="page-info" id="page-info"></div>
  </div>
</div>

<script>
// ── Data (injected by build script) ──
const MODEL_INFO = {{MODEL_INFO}};
const TSRM_SECTIONS = {{TSRM_SECTIONS}};
const EWD_SECTIONS = {{EWD_SECTIONS}};

// ── State ──
const state = {
  docType: TSRM_SECTIONS.length > 0 ? 'tsrm' : 'ewd',
  section: null,
  page: null,
  zoom: 1,
  pan: { x: 0, y: 0 },
  dragging: false,
  dragStart: { x: 0, y: 0 },
  panStart: { x: 0, y: 0 },
  sidebarOpen: false
};

const MIN_ZOOM = 1;
const MAX_ZOOM = 5;

// ── Elements ──
const $ = (id) => document.getElementById(id);
const viewer = $('viewer');
const img = $('page-img');
const breadcrumb = $('breadcrumb');
const pageInfo = $('page-info');
const btnPrev = $('btn-prev');
const btnNext = $('btn-next');
const zoomControls = $('zoom-controls');
const zoomPct = $('zoom-pct');
const zoomResetBtn = $('zoom-reset-btn');
const sidebar = $('sidebar');
const backdrop = $('backdrop');

// ── Init ──
function init() {
  $('topbar-model').textContent = MODEL_INFO.name + ' \u00B7 ' + MODEL_INFO.year;
  renderDocTabs();
  const sections = getCurrentSections();
  if (sections.length > 0 && sections[0].page_index.length > 0) {
    navigate(state.docType, sections[0].code, sections[0].page_index[0].page);
  }
}

function getCurrentSections() {
  return state.docType === 'tsrm' ? TSRM_SECTIONS : EWD_SECTIONS;
}

// ── Doc Type Tabs ──
function renderDocTabs() {
  const tabs = $('doc-tabs');
  tabs.innerHTML = '';
  if (TSRM_SECTIONS.length > 0) {
    const btn = document.createElement('button');
    btn.className = 'doc-tab' + (state.docType === 'tsrm' ? ' active' : '');
    btn.textContent = 'Repair Manual';
    btn.onclick = () => switchDocType('tsrm');
    tabs.appendChild(btn);
  }
  if (EWD_SECTIONS.length > 0) {
    const btn = document.createElement('button');
    btn.className = 'doc-tab' + (state.docType === 'ewd' ? ' active' : '');
    btn.textContent = 'Wiring Diagrams';
    btn.onclick = () => switchDocType('ewd');
    tabs.appendChild(btn);
  }
  // Hide tabs if only one doc type
  if ((TSRM_SECTIONS.length === 0) || (EWD_SECTIONS.length === 0)) {
    tabs.style.display = 'none';
  }
}

function switchDocType(docType) {
  state.docType = docType;
  renderDocTabs();
  const sections = getCurrentSections();
  if (sections.length > 0 && sections[0].page_index.length > 0) {
    navigate(docType, sections[0].code, sections[0].page_index[0].page);
  }
}

// ── Navigation ──
function navigate(docType, sectionCode, pageNum) {
  state.docType = docType;
  state.section = sectionCode;
  state.page = pageNum;
  resetZoom();
  renderSidebar();
  renderPage();
  updateNav();
}

function renderSidebar() {
  const sections = getCurrentSections();
  const totalPages = sections.reduce((sum, s) => sum + s.pages, 0);
  $('sidebar-meta').textContent = sections.length + ' sections \u00B7 ' + totalPages.toLocaleString() + ' pages';

  const list = $('section-list');
  list.innerHTML = '';
  sections.forEach(s => {
    const item = document.createElement('div');
    item.className = 'section-item' + (s.code === state.section ? ' active' : '');
    item.innerHTML = '<span class="section-code">' + escHtml(s.code) + '</span><span class="section-name">' + escHtml(s.name) + '</span>';
    item.onclick = () => {
      if (s.page_index.length > 0) {
        navigate(state.docType, s.code, s.page_index[0].page);
        closeSidebar();
      }
    };
    list.appendChild(item);
  });
}

function renderPage() {
  const path = getImagePath(state.docType, state.section, state.page);
  img.src = path;
  img.alt = state.section + ' page ' + state.page;

  const section = findSection(state.docType, state.section);
  const pageEntry = section ? section.page_index.find(p => p.page === state.page) : null;
  const padded = String(state.page).padStart(3, '0');
  const docLabel = state.docType === 'tsrm' ? 'TSRM' : 'EWD';
  breadcrumb.innerHTML = docLabel + ' <strong>' + escHtml(state.section) + '</strong> \u00B7 ' + padded;
  pageInfo.textContent = (section ? section.name : '') + ' \u2014 Page ' + padded + (pageEntry && pageEntry.title ? ' \u2014 ' + pageEntry.title.replace(/\n/g, ' ') : '');

  // EWD zoom mode
  const isEwd = state.docType === 'ewd';
  viewer.classList.toggle('ewd', isEwd);
  zoomControls.style.display = isEwd ? 'flex' : 'none';
}

function getImagePath(docType, section, page) {
  const padded = String(page).padStart(3, '0');
  const folder = docType === 'tsrm' ? 'tsrm' : 'ewd';
  return folder + '/' + section + '/' + section + '_' + padded + '.png';
}

function findSection(docType, code) {
  const sections = docType === 'tsrm' ? TSRM_SECTIONS : EWD_SECTIONS;
  return sections.find(s => s.code === code);
}

// ── Prev / Next ──
function getAdjacentPage(direction) {
  const sections = getCurrentSections();
  let secIdx = sections.findIndex(s => s.code === state.section);
  if (secIdx < 0) return null;
  const sec = sections[secIdx];
  const pageIdx = sec.page_index.findIndex(p => p.page === state.page);

  if (direction === -1 && pageIdx > 0) {
    return { section: sec.code, page: sec.page_index[pageIdx - 1].page };
  }
  if (direction === 1 && pageIdx < sec.page_index.length - 1) {
    return { section: sec.code, page: sec.page_index[pageIdx + 1].page };
  }
  // Cross section boundary
  const nextSecIdx = secIdx + direction;
  if (nextSecIdx < 0 || nextSecIdx >= sections.length) return null;
  const nextSec = sections[nextSecIdx];
  if (nextSec.page_index.length === 0) return null;
  const nextPage = direction === 1 ? nextSec.page_index[0].page : nextSec.page_index[nextSec.page_index.length - 1].page;
  return { section: nextSec.code, page: nextPage };
}

function navigatePrev() {
  const target = getAdjacentPage(-1);
  if (target) navigate(state.docType, target.section, target.page);
}

function navigateNext() {
  const target = getAdjacentPage(1);
  if (target) navigate(state.docType, target.section, target.page);
}

function updateNav() {
  btnPrev.disabled = !getAdjacentPage(-1);
  btnNext.disabled = !getAdjacentPage(1);
}

// ── Keyboard ──
document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowLeft') { e.preventDefault(); navigatePrev(); }
  if (e.key === 'ArrowRight') { e.preventDefault(); navigateNext(); }
});

// ── EWD Zoom / Pan ──
function applyTransform() {
  const transition = state.dragging ? 'none' : 'transform 0.15s ease-out';
  img.style.transition = transition;
  img.style.transform = 'scale(' + state.zoom + ') translate(' + state.pan.x + 'px, ' + state.pan.y + 'px)';
  zoomPct.textContent = Math.round(state.zoom * 100) + '%';
  viewer.classList.toggle('zoomed', state.zoom > MIN_ZOOM);
  zoomResetBtn.style.display = state.zoom > MIN_ZOOM ? 'inline' : 'none';
}

function zoomIn() {
  state.zoom = Math.min(MAX_ZOOM, state.zoom * 1.3);
  applyTransform();
}

function zoomOut() {
  state.zoom = Math.max(MIN_ZOOM, state.zoom / 1.3);
  if (state.zoom <= MIN_ZOOM) { state.pan.x = 0; state.pan.y = 0; }
  applyTransform();
}

function resetZoom() {
  state.zoom = MIN_ZOOM;
  state.pan = { x: 0, y: 0 };
  state.dragging = false;
  viewer.classList.remove('dragging');
  applyTransform();
}

viewer.addEventListener('wheel', (e) => {
  if (state.docType !== 'ewd') return;
  e.preventDefault();
  const delta = e.deltaY > 0 ? 0.9 : 1.1;
  state.zoom = Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, state.zoom * delta));
  if (state.zoom <= MIN_ZOOM) { state.pan.x = 0; state.pan.y = 0; }
  applyTransform();
}, { passive: false });

viewer.addEventListener('pointerdown', (e) => {
  if (state.docType !== 'ewd' || state.zoom <= MIN_ZOOM) return;
  state.dragging = true;
  state.dragStart = { x: e.clientX, y: e.clientY };
  state.panStart = { x: state.pan.x, y: state.pan.y };
  viewer.classList.add('dragging');
  viewer.setPointerCapture(e.pointerId);
});

viewer.addEventListener('pointermove', (e) => {
  if (!state.dragging) return;
  state.pan.x = state.panStart.x + (e.clientX - state.dragStart.x) / state.zoom;
  state.pan.y = state.panStart.y + (e.clientY - state.dragStart.y) / state.zoom;
  applyTransform();
});

viewer.addEventListener('pointerup', () => {
  if (!state.dragging) return;
  state.dragging = false;
  viewer.classList.remove('dragging');
});

viewer.addEventListener('dblclick', () => {
  if (state.docType !== 'ewd') return;
  resetZoom();
});

// ── Sidebar Toggle (mobile) ──
function toggleSidebar() {
  state.sidebarOpen = !state.sidebarOpen;
  sidebar.classList.toggle('open', state.sidebarOpen);
  backdrop.classList.toggle('open', state.sidebarOpen);
}

function closeSidebar() {
  state.sidebarOpen = false;
  sidebar.classList.remove('open');
  backdrop.classList.remove('open');
}

// ── Utils ──
function escHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// ── Start ──
init();
</script>
</body>
</html>
